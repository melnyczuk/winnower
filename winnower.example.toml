# Copy to winnower.toml (git-ignored) or set the matching WINNOWER_* env vars.
# API keys are better kept in .env (git-ignored) or passed with --token: see the README.

# Where samples, sidecars and the index live. A local path or file:// URI now;
# s3://bucket/prefix later (install the `s3` extra). Nothing else changes.
storage_root = "./data"

# Freesound API key from https://freesound.org/apiv2/apply (env: FREESOUND_TOKEN)
# freesound_token = "..."

# Optional Openverse token for higher limits (env: OPENVERSE_TOKEN). Anonymous works.
# openverse_token = "..."

[licences]
# allow: use freely · flag: keep but mark (e.g. non-commercial) · deny: skip at harvest time
# An entry without a version ("CC-BY") matches every version; "CC-BY-4.0" matches only 4.0.
# ND licences are always denied. Move "NASA-Media" to allow if you've checked the items.
allow = ["CC0-1.0", "PDM", "CC-BY"]
flag = ["CC-BY-NC", "CC-BY-SA", "CC-BY-NC-SA", "Sampling+", "NASA-Media"]

[analysis]
sample_rate = 44100
max_regions_per_file = 4
min_interest = 0.35
# Phrase lengths in seconds: never shorter than min, aiming at target. Every phrase is cut
# to whole bars of 4/4 at a whole-number tempo inside [bpm_min, bpm_max].
min_duration_s = 2.0      # env: WINNOWER_MIN_DURATION_S; per run: harvest --min-length
target_duration_s = 10.0
max_duration_s = 24.0
bpm_min = 70
bpm_max = 150

[output]
# "flac" (default): lossless, loops play seamlessly.
# "mp3": 320k CBR, about 3-4x smaller. MP3 encoders pad the start and end of the file, so
# a sampler or DAW that ignores the gapless header may click or drift at the loop point.
# Env: WINNOWER_OUTPUT_FORMAT. Changing it later leaves existing samples as they are.
format = "flac"

[crawl]
# How gently requests are paced, per host (searches and downloads alike).
min_interval_s = 1.5      # base gap between requests to one host (env: WINNOWER_MIN_INTERVAL_S)
jitter = 0.5              # each gap varies by up to ±50%, so requests never fall into a beat
max_retries = 4           # for 429, 502, 503, 504 and dropped connections
max_backoff_s = 300       # a host asking for a longer wait is left alone; the run stops
breather_every = [25, 60] # a longer pause after this many requests to one host ([0, 0]: off)
breather_s = [10, 40]     # length of that pause, in seconds
