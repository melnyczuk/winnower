[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harvester"
version = "0.1.0"
description = "Harvest licensed audio, find aurally interesting textural regions, and store them with rich metadata."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "librosa>=0.10",
  "soundfile>=0.12",
  "ruptures>=1.1.9",
  "requests>=2.31",
  "fsspec>=2024.2",
]

[project.optional-dependencies]
s3 = ["s3fs>=2024.2"]
index = ["lancedb>=0.20", "pyarrow>=15"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
harvester = "harvester.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/harvester"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
